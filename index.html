<!doctype html>
<html lang="th">
<meta charset="utf-8">
<title>HYPO ค้นหา</title>
<input id="q" placeholder="พิมพ์คำค้นหา (A/B)" style="width:60%">
<button onclick="go()">ค้นหา</button>
<pre id="out">พร้อมค้นหา…</pre>
<script>
const API = "https://script.google.com/macros/s/AKfycbwMK7FxZUaihM0o2cdm1BbGP4c6BRL4ntJcesm15kIjaOulck7ut42z2uZY73a86ba9/exec";

function go(){
  const term = (document.getElementById('q').value||'').trim();
  if(!term) return;
  jsonp(API + "?q=" + encodeURIComponent(term), data => {
    document.getElementById('out').textContent = JSON.stringify(data, null, 2);
  }).catch(err=>{
    document.getElementById('out').textContent = 'JSONP error: ' + err.message;
  });
}

function jsonp(url, onSuccess){
  return new Promise((resolve,reject)=>{
    const cb = "cb_"+Date.now();
    window[cb] = d => { try{ onSuccess(d); resolve(); } finally { cleanup(); } };
    const s = document.createElement("script");
    s.src = url + (url.includes("?")?"&":"?") + "callback=" + cb;
    s.onerror = () => { cleanup(); reject(new Error("script load failed")); }
    document.body.appendChild(s);
    function cleanup(){ delete window[cb]; s.remove(); }
  });
}
</script>
</html>
