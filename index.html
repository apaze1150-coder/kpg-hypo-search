<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HYPO – ทดสอบค้นหา</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;background:#f7fbff;color:#0b2a4a;margin:0;padding:24px}
    .wrap{max-width:920px;margin:auto}
    .card{background:#fff;border:1px solid #e6eef7;border-radius:14px;box-shadow:0 8px 20px rgba(11,42,74,.06);padding:16px}
    .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    input{flex:1;min-width:260px;padding:12px 14px;border:1px solid #b7d3f2;border-radius:10px;font-size:16px}
    button{padding:12px 16px;border:0;border-radius:10px;background:#155EFB;color:#fff;font-weight:700;cursor:pointer}
    pre{background:#0b2a4a0a;border:1px solid #e6eef7;border-radius:10px;padding:12px;white-space:pre-wrap}
    .err{color:#a30012}
    .muted{color:#5c728a}
    small a{font-size:12px}
  </style>
</head>
<body>
<div class="wrap">
  <h1>🔎 ค้นหาข้อมูล (โหมดดีบัก)</h1>
  <div class="card">
    <div class="row">
      <input id="q" placeholder="พิมพ์คำค้นหา (ค้น A/B แถว 17–21 ทุกชีต)">
      <button id="btn" onclick="search()">ค้นหา</button>
    </div>
    <div id="status" class="muted">พิมพ์คำแล้วกด “ค้นหา”</div>
    <div><small id="link"></small></div>
    <pre id="out"></pre>
  </div>
</div>

<script>
  // >>> ใส่ URL Web App ของคุณ (ลงท้าย /exec) <<<
  const API = https://script.google.com/macros/s/AKfycbwjgLsN-gXRRDeJM1n708pG9lsG_6UJwKwy4-hYe-7VGd05FpCkGPCWA34mMgeiGDKG/exec;

  // ===== helper =====
  function jsonp(url, onSuccess){
    return new Promise((resolve,reject)=>{
      const cb = "cb_"+Date.now();
      window[cb] = d => { try{ onSuccess(d); resolve(); } finally { cleanup(); } };
      const s = document.createElement("script");
      s.src = url + (url.includes("?")?"&":"?") + "callback=" + cb;
      s.onerror = () => { cleanup(); reject(new Error("JSONP script load failed")); };
      document.body.appendChild(s);
      function cleanup(){ delete window[cb]; s.remove(); }
    });
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  async function search(){
    const input = document.getElementById('q');
    const term  = (input ? input.value : "").trim();
    const out   = document.getElementById('out');
    const link  = document.getElementById('link');
    const status= document.getElementById('status');

    // ตรวจ API ถูกตั้งหรือยัง
    if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API)){
      status.innerHTML = '<span class="err">ยังไม่ได้ตั้งค่า API (/exec) ที่ถูกต้อง</span>';
      out.textContent = "";
      link.innerHTML = "";
      return;
    }

    // ตรวจว่ามีคำค้น
    if(!term){
      status.innerHTML = '<span class="err">ยังไม่ได้พิมพ์คำค้นหา → ระบบจะไม่ส่ง q</span>';
      out.textContent = "";
      link.innerHTML = "";
      return;
    }

    // สร้าง URL และโชว์ให้คลิกตรวจเองได้
    const url = API + "?q=" + encodeURIComponent(term);
    status.textContent = "กำลังค้นหา…";
    link.innerHTML = 'ตรวจปลายทาง: <a target="_blank" href="'+esc(url+'&callback=demo')+'">'+esc(url+'&callback=demo')+'</a>';

    try{
      await jsonp(url, (data)=>{ out.textContent = JSON.stringify(data, null, 2); });
      status.textContent = "สำเร็จ";
    }catch(e){
      status.innerHTML = '<span class="err">'+esc(e.message)+'</span>';
    }
  }

  // รองรับกด Enter
  document.addEventListener('keydown', (e)=>{ if(e.key==='Enter') search(); });
</script>
</body>
</html>
